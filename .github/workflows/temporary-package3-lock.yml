name: Temporary Package 3 Lock Refresh

on:
  push:
    branches: [package-3-auth-security]
    paths: [package.json]

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
          ref: package-3-auth-security
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: refresh lockfile for package 3 auth"
          git push origin HEAD:package-3-auth-security
